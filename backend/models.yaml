version: "1.0.0"
models:
  image:
    # Calibration and threshold from ml/eval/results/image/image-convnext_tiny-freq-robust-2.0.0/metrics.json
    # Trained on seven GenImage generators (ADM, SD 1.4, SD 1.5, GLIDE, Wukong, VQDM, Midjourney); BigGAN unseen.
    name: "image-convnext_tiny-freq-robust"
    version: "2.0.0"
    onnx_file: "checkpoints/onnx/image-convnext_tiny-freq-robust-2.0.0.onnx"
    pytorch_checkpoint: "checkpoints/image/image-convnext_tiny-freq-robust-2.0.0/image-convnext_tiny-freq-robust-2.0.0-best.pt"
    image_size: 224
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
    decision_threshold: 0.625874
    temperature: 0.745717
    bias: -0.459102
    disclaimer: "Results are probabilistic and must not be used alone to make decisions about a person."

  audio:
    # Mean-over-windows calibration and threshold from ml/eval/results/audio/audio-lcnn-lfcc-robust-1.0.0/metrics.json
    name: "audio-lcnn-lfcc-robust"
    version: "1.0.0"
    onnx_file: "checkpoints/onnx/audio-lcnn-lfcc-robust-1.0.0.onnx"
    sample_rate: 16000
    clip_seconds: 4.0
    window_overlap: 0.5
    decision_threshold: 0.883203
    temperature: 0.320716
    bias: 4.09388
    disclaimer: "Results are probabilistic and must not be used alone to make decisions about a person."

  text:
    name: "text-stats-ensemble"
    version: "1.0.0"
    meta_file: "checkpoints/text/meta.joblib"
    decision_threshold: 0.50
    disclaimer: "This result is probabilistic. Detectors make mistakes, and they flag non-native English writers more often. Never use it alone to decide academic misconduct or any other penalty."
