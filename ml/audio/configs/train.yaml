# Audio detector experiment. Example sweep of the spectrogram models over all three features:
#   python -m ml.audio.train -m model=resnet18,lcnn feature=mel,lfcc,cqt
# Self-supervised backbones read the waveform, so the feature setting does not apply:
#   python -m ml.audio.train model=wav2vec2
defaults:
  - model: lcnn
  - feature: lfcc
  - augment: robust
  - _self_

version: 1.0.0
seed: 1337

manifest: data/manifests/asvspoof2019_la.csv
data_root: data/processed
checkpoint_dir: checkpoints/audio

sample_rate: 16000
clip_seconds: 4

epochs: 30
warmup_epochs: 1
steps_per_epoch: null   # Caps an epoch so a run fits inside a free Colab session
weight_decay: 0.0001
label_smoothing: 0.1
max_grad_norm: 1.0
patience: 5
num_workers: 2
amp: true
device: auto

tracker: wandb          # wandb or none; metrics.jsonl is always written
wandb_project: truthlens-audio

hydra:
  job:
    chdir: false
